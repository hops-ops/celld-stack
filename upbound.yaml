apiVersion: meta.dev.upbound.io/v2alpha1
kind: Project
metadata:
  name: celld-stack
spec:
  dependsOn:
  - apiVersion: pkg.crossplane.io/v1
    kind: Function
    package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready
    version: '>=v0 <v1'
  - apiVersion: pkg.crossplane.io/v1
    kind: Provider
    package: xpkg.crossplane.io/crossplane-contrib/provider-helm
    version: '>=v1 <v2'
  - apiVersion: pkg.crossplane.io/v1
    kind: Provider
    package: xpkg.crossplane.io/crossplane-contrib/provider-kubernetes
    version: '>=v1 <v2'
  - apiVersion: pkg.crossplane.io/v1
    kind: Provider
    package: xpkg.crossplane.io/crossplane-contrib/provider-aws-s3
    version: '>=v2 <v3'
  - apiVersion: pkg.crossplane.io/v1
    kind: Configuration
    package: ghcr.io/hops-ops/aws-pod-identity
    version: '>=v0 <v1'
  description: Installs celld, Deno's self-hosted Durable Objects runtime, as a Helm
    release. Fleet nodes coordinate through an object-storage bucket you own.
  license: Apache-2.0
  maintainer: Patrick Lee Scott <pat@patscott.io>
  readme: |
    # celld-stack

    Single-claim install of celld (self-hosted Durable Objects) onto a target
    Kubernetes cluster.

    Composes:
    - Namespace for the release
    - celld Helm release (StatefulSet, public Service, internal headless Service)
    - Optional in-cluster Azurite (local)
    - Optional AWS S3 bucket + EKS Pod Identity (aws.enabled)
  repository: ghcr.io/hops-ops/celld-stack
  source: github.com/hops-ops/celld-stack
